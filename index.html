
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historeon - Email Verification</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #151923;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: #202735;
            padding: 45px 30px;
            border-radius: 16px;
            max-width: 420px;
            width: 85%;
        }

        .icon {
            font-size: 65px;
            color: #70d6a0;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        .brand {
            margin-top: 30px;
            color: #70d6a0;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✓</div>
        <h1>Email Verification</h1>
        <p>Your email verification process has been completed.</p>
        <p>You can now return to Historeon and log in to your account.</p>
        <div class="brand">HISTOREON</div>
    </div>
</body>
</html>
